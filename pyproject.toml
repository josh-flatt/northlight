[project]
name = "northlight"
version = "0.0.0a"
authors = [
  { name="Josh", email="josh.m.flatt@gmail.com" },
]
description = "Example project"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/josh-flatt/ember"
Issues = "https://github.com/josh-flatt/ember/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"